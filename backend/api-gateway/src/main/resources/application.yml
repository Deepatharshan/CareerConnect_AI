server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/v1/jobs/**
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/v1/profiles/**
        - id: application-service
          uri: lb://application-service
          predicates:
            - Path=/api/v1/applications/**
        - id: ai-cv-service
          uri: lb://ai-cv-service
          predicates:
            - Path=/api/v1/ai/**
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/v1/recommendations/**
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/v1/companies/**
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat/**
        - id: video-interview-service
          uri: lb://video-interview-service
          predicates:
            - Path=/api/v1/interviews/**
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
