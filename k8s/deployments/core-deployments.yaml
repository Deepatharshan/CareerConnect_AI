apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: career-connect
    service: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      service: auth
  template:
    metadata:
      labels:
        app: career-connect
        service: auth
    spec:
      containers:
      - name: auth-service
        image: careerconnect/auth-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-svc:3306/career_connect_db"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-svc:9092"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://discovery-server-svc:8761/eureka/"

---
